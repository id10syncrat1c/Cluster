name: Nightly Discord Notifications

on:
  push:
    branches:
      - Nightly

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi

          BODY=$(jq -n --arg content "🌙 **Cluster Nightly updated**\nRepository: $REPOSITORY\nBranch: $BRANCH\nBy: $ACTOR\nCommit: ${COMMIT:0:7}\nMessage: $MESSAGE\n$COMPARE_URL" '{content: $content}')
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$DISCORD_WEBHOOK_URL"

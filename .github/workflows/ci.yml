name: Rust CI

on:
  push:
    branches:
      - main
      - Nightly
      - libra-v0.3.1
      - libra-v0.4.0-native-tui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - run: cargo test --all-targets --locked
